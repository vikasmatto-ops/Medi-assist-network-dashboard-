name: Refresh ICICI Lombard official hospital locator
on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *' # daily around 06:45 IST, may run late
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_icici.py'
      - 'scripts/icici_live_collector.py'
      - 'scripts/icici_nationwide_collector.py'
      - '.github/workflows/refresh-icici-lombard.yml'
permissions:
  contents: write
concurrency:
  group: networkiq-icici-refresh
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML form parser and official client dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Collect fresh public city searches in this shard
        run: python -u scripts/refresh_icici.py --shard-index ${{ matrix.shard }} --shard-count 6 --out build/icici/icici-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icici-shard-${{ matrix.shard }}
          path: build/icici/icici-shard-${{ matrix.shard }}.json
          retention-days: 5
          if-no-files-found: warn
  publish:
    if: always()
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: icici-shard-*
          path: build/icici
          merge-multiple: true
      - name: Validate all state and city scans before any update
        run: python -m scripts.refresh_icici --publish --input build/icici --previous data/icici_lombard.json --out data/icici_lombard.json
      - name: Safely publish only verified ICICI snapshot
        run: |
          git config user.name 'networkiq-automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/icici_lombard.json
          if git diff --cached --quiet; then echo 'ICICI_NO_CHANGE'; exit 0; fi
          base_sha="$(git rev-parse HEAD)"
          git commit -m 'Refresh fully verified ICICI Lombard search listings'
          for n in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$base_sha" origin/main -- data/icici_lombard.json; then
              echo 'CONCURRENT_ICICI_DATA_CHANGE; no publication'; exit 1
            fi
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then echo 'ICICI_REFRESH_PUBLISHED'; exit 0; fi
            sleep $((n * 2))
          done
          exit 1
