name: Refresh Medi Assist 11-city snapshot
on:
  workflow_dispatch:
  schedule:
    # Daily at 9:30 IST. Github scheduled execution can be delayed.
    - cron: '0 4 * * *'
permissions:
  contents: write
concurrency:
  group: mediassist-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate current source snapshot
        run: python scripts/refresh_network.py --live
      - name: Commit only validated data changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hospitals.json
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Refresh Medi Assist hospital snapshot (validated)'
            git push
          fi
