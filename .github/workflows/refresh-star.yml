name: Refresh Star Health official public directory
on:
  workflow_dispatch:
  schedule:
    - cron: '45 20 * * *' # daily around 02:15 IST; GitHub scheduling may delay
  push:
    branches: [main]
    paths:
      - 'scripts/collect_star.py'
      - 'scripts/validate_star.py'
      - 'scripts/star_live_freshness.py'
      - 'tests/test_star_freshness.py'
      - 'tests/test_star_v7.py'
      - 'tests/test_star_v8.py'
      - 'index.html'
      - '.github/workflows/refresh-star.yml'
permissions:
  contents: write
concurrency:
  group: networkiq-star-health
  cancel-in-progress: false
jobs:
  fetch-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Star collector offline before contacting API
        run: python -B -m unittest discover -s tests -p 'test_star*.py' -q
      - name: Restore resumable Star state-category page checkpoints
        uses: actions/cache/restore@v4
        with:
          path: build/star/checkpoints
          key: networkiq-star-pages-${{ github.run_id }}
          restore-keys: |
            networkiq-star-pages-
      - name: Collect 216 Star query partitions by direct first-party POST
        id: collect
        run: python scripts/collect_star.py --out build/star --delay 0.6 --page-size 10
      # STAR_LIVE_FRESHNESS_V1: source count and first-page recheck before publish.
      - name: Recheck live Star partition totals and first-page records
        id: parity
        if: steps.collect.outcome == 'success'
        run: python scripts/star_live_freshness.py --input build/star --page-size 10 --delay 0.2
      - name: Validate complete snapshot and prepare Star-only JSON outputs
        if: steps.collect.outcome == 'success' && steps.parity.outcome == 'success'
        run: python scripts/validate_star.py --input build/star --live data
      - name: Commit only both verified Star datasets
        if: steps.collect.outcome == 'success' && steps.parity.outcome == 'success'
        run: |
          git config user.name 'networkiq-automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/star_health.json data/star_health_excluded.json
          if git diff --cached --quiet; then
            echo 'No Star data changes'
            exit 0
          fi
          git commit -m 'Refresh verified Star Health public hospital directory'
          git push
      - name: Preserve Star collection audit and public-source identity review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: networkiq-star-audit
          path: |
            build/star/star_audit.json
            build/star/star_identity_review.json
            build/star/star_live_freshness.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save checkpoints for safe restart; never publish partial data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/star/checkpoints
          key: networkiq-star-pages-${{ github.run_id }}
