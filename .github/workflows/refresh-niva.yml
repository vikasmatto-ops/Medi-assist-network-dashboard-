name: Refresh Niva Bupa public network
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *' # daily 10:45 IST
permissions:
  contents: write
concurrency:
  group: networkiq-refresh-niva
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect all pages directly from official Niva API
        run: python scripts/collect_niva.py --output build/niva --delay 0.35
      - name: Convert official snapshot and run completeness checks
        run: python scripts/prepare_niva.py build/NetworkIQ_Niva_DirectAPI_COMPLETE.zip build/niva_bupa.json --audit build/niva_audit.json
      - name: Refuse unusually large source-count changes
        run: python scripts/validate_refresh.py data/niva_bupa.json build/niva_bupa.json
      - name: Publish Niva-only data update
        run: |
          if git diff --quiet -- data/niva_bupa.json; then
            echo 'No changes to publish'
            exit 0
          fi
          git config user.name 'networkiq-automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/niva_bupa.json
          git commit -m 'Refresh Niva Bupa official hospital network'
          git push
