name: Refresh Care Health state-verified locator listings
on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *' # around 02:00 IST; GitHub may delay
  push:
    branches: [main]
    paths:
      - 'scripts/care_network/**'
      - 'scripts/refresh_care_merge.py'
      - '.github/workflows/refresh-care-health.yml'
permissions:
  contents: write
concurrency:
  group: networkiq-care-refresh
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public browser observation tools
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Run Care source quality regressions
        run: python -B -m unittest discover -s tests -p 'test_care_pipeline.py' -q
      - name: Capture website-generated Care public locator responses
        run: python -m scripts.care_network.collect --all-states --shard-count 6 --shard-index ${{ matrix.shard }} --output-dir build/care
      - name: Preserve source evidence even on partial state errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-shard-${{ matrix.shard }}
          path: build/care/
          retention-days: 7
          if-no-files-found: warn
  publish:
    if: always()
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: care-shard-*
          path: build/care
          merge-multiple: true
      - name: Publish only individually verified states; retain other states as dated snapshots
        run: python -m scripts.refresh_care_merge --staging build/care --previous data/care_health.json --output data/care_health.json --audit build/care_refresh_audit.json
      - name: Publish Care source data without touching other insurers
        run: |
          git config user.name 'networkiq-automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/care_health.json
          if git diff --cached --quiet; then echo 'CARE_NO_CHANGE'; exit 0; fi
          base_sha="$(git rev-parse HEAD)"
          git commit -m 'Refresh individually verified Care Health state listings'
          for n in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$base_sha" origin/main -- data/care_health.json; then
              echo 'CONCURRENT_CARE_DATA_CHANGE; no publication'; exit 1
            fi
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then echo 'CARE_REFRESH_PARTIAL_STATES_PUBLISHED'; exit 0; fi
            sleep $((n * 2))
          done
          exit 1
      - name: Preserve Care held-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: networkiq-care-refresh-quality-audit
          path: build/care_refresh_audit.json
          retention-days: 14
          if-no-files-found: warn
