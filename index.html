<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MediAssist Hospital Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.topbar{background:#0f172a;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:#3b82f6;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800}
.logo-text{font-size:15px;font-weight:700;color:#f1f5f9}
.logo-text span{color:#3b82f6}
.top-badge{font-size:11px;background:rgba(59,130,246,.15);color:#93c5fd;padding:4px 12px;border-radius:20px;font-family:'JetBrains Mono',monospace}
.hero{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 60%,#0f172a 100%);padding:44px 24px 36px}
.hero-title{font-size:28px;font-weight:800;color:#fff;text-align:center;margin-bottom:6px}
.hero-title span{color:#3b82f6}
.hero-sub{font-size:13px;color:rgba(255,255,255,.45);text-align:center;margin-bottom:28px}
.search-box{max-width:900px;margin:0 auto;background:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px}
.search-row{display:flex;gap:10px;flex-wrap:wrap}
.si{flex:2;min-width:220px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:8px;padding:10px 14px;font-size:13px;color:#0f172a;outline:none;font-family:'Inter',sans-serif}
.si:focus{border-color:#3b82f6;background:#fff}
.ss{flex:1;min-width:140px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:8px;padding:0 10px;font-size:12px;color:#0f172a;outline:none;cursor:pointer;height:42px;font-family:'Inter',sans-serif}
.ss:focus{border-color:#3b82f6}
.btn-s{background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:0 22px;font-size:13px;font-weight:600;cursor:pointer;height:42px;white-space:nowrap}
.btn-s:hover{background:#2563eb}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding-top:6px;border-top:1px solid #f1f5f9}
.flbl{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}
.ppn-lbl{display:flex;align-items:center;gap:6px;font-size:12px;color:#374151;cursor:pointer;font-weight:500}
.ppn-lbl input{accent-color:#22c55e}
.btn-clr{background:#fff;color:#94a3b8;border:1.5px solid #e2e8f0;border-radius:8px;padding:0 14px;font-size:11px;cursor:pointer;height:34px}
.btn-clr:hover{border-color:#ef4444;color:#ef4444}
.kpi-strip{display:flex;background:#fff;border-bottom:2px solid #e5e7eb;overflow-x:auto;scrollbar-width:none}
.kpi-strip::-webkit-scrollbar{display:none}
.kc{padding:13px 16px;border-right:1px solid #f1f5f9;cursor:pointer;transition:all .15s;white-space:nowrap;text-align:center;border-bottom:3px solid transparent;min-width:95px}
.kc:hover{background:#f8fafc}
.kc.active{border-bottom-color:#3b82f6;background:#eff6ff}
.kc-name{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.kc.active .kc-name{color:#1d4ed8}
.kc-num{font-size:19px;font-weight:800;color:#0f172a;letter-spacing:-1px;line-height:1}
.kc.active .kc-num{color:#2563eb}
.kc-ppn{font-size:9px;color:#16a34a;font-weight:600;margin-top:3px}
.wrap{width:100%;display:flex;justify-content:center}
.content{padding:20px 24px;display:flex;flex-direction:column;gap:14px;max-width:1400px;width:100%}
.rhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.rtitle{font-size:15px;font-weight:700;color:#0f172a}
.rcnt{font-size:11px;color:#94a3b8;font-family:'JetBrains Mono',monospace;margin-top:2px}
.btn-dl{padding:7px 16px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;background:#3b82f6;color:#fff;border:none}
.btn-dl:hover{background:#2563eb}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hcard{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px 18px;transition:all .15s;position:relative;overflow:hidden}
.hcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#3b82f6}
.hcard.ppn::before{background:linear-gradient(90deg,#22c55e,#16a34a)}
.hcard:hover{box-shadow:0 6px 20px rgba(0,0,0,.1);transform:translateY(-2px)}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.cname{font-size:13px;font-weight:700;color:#0f172a;line-height:1.35;flex:1}
.cbadges{display:flex;gap:4px;flex-shrink:0;flex-direction:column;align-items:flex-end}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;white-space:nowrap}
.badge.ppn{background:#dcfce7;color:#15803d}
.badge.city{background:#dbeafe;color:#1e40af}
.badge.all-ins{background:#fef3c7;color:#92400e}
.caddr{font-size:11px;color:#64748b;margin-bottom:8px;line-height:1.5}
.cdet{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;color:#374151;font-family:'JetBrains Mono',monospace}
.cico{width:16px;text-align:center;font-size:11px;flex-shrink:0}
.spwrap{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.sp{font-size:10px;color:#6d28d9;background:#ede9fe;padding:2px 7px;border-radius:20px;font-weight:500}
.inssec{margin-top:8px;padding-top:8px;border-top:1px solid #f1f5f9}
.inslbl{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.insval{font-size:10px;color:#374151;line-height:1.6}
.ins-all-badge{display:inline-block;background:#fef9c3;color:#713f12;border:1px solid #fde68a;border-radius:6px;padding:3px 10px;font-size:10px;font-weight:700;margin-bottom:4px}
.nores{text-align:center;padding:60px 20px;color:#94a3b8;grid-column:1/-1}
.pg{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:11px;color:#94a3b8;font-family:'JetBrains Mono',monospace}
.pgbtns{display:flex;gap:6px}
.pgbtn{background:#fff;border:1.5px solid #e2e8f0;color:#374151;border-radius:6px;padding:6px 14px;font-size:11px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:600}
.pgbtn:hover:not(:disabled){border-color:#3b82f6;color:#1d4ed8;background:#eff6ff}
.pgbtn:disabled{opacity:.3;cursor:default}
@media(max-width:640px){
  .hero{padding:28px 16px 22px}
  .hero-title{font-size:20px}
  .search-row{flex-direction:column}
  .si,.ss{width:100%;min-width:unset}
  .content{padding:12px}
  .hgrid{grid-template-columns:1fr}
  .kc{min-width:80px;padding:10px 8px}
  .kc-num{font-size:16px}
}

/* Insurer names are real source entries; never hide them behind an all-insurer claim. */
.ins-chips{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 2px}
.ins-chip{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:5px;padding:3px 6px;font-size:10px;line-height:1.35;color:#334155;max-width:100%;overflow-wrap:anywhere}
.ins-chip.ins-match{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8;font-weight:700}
.ins-more{margin-top:7px;font-size:10px;color:#1d4ed8}
.ins-more summary{cursor:pointer;font-weight:700;user-select:none}
.ins-more .ins-chips{padding:6px 0}
.ins-empty{font-size:10px;color:#94a3b8}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">
    <div class="logo-icon">M</div>
    <div class="logo-text">Network<span>IQ</span> Hospital Finder</div>
  </div>
  <div class="top-badge" id="total-badge">Loading...</div>
</div>
<div class="hero">
  <div class="hero-title">Find <span>Source-Listed Hospitals</span> Across India</div>
  <div class="hero-sub" id="source-meta">Loading latest validated hospital snapshot...</div>
  <div class="search-box">
    <div class="search-row">
      <input class="si" id="q-search" placeholder="Search hospital name, area or PIN..." oninput="applyF()">
      <select class="ss" id="q-source" onchange="buildKPI();applyF()">
        <option value="">Both Sources</option>
        <option value="Medi Assist">Medi Assist</option>
        <option value="ICICI Lombard">ICICI Lombard</option>
        <option value="IndusInd General Insurance">IndusInd General Insurance</option>
      </select>
      <select class="ss" id="q-state" onchange="onStateChange()"><option value="">All States</option></select>
      <select class="ss" id="q-city" onchange="applyF()"><option value="">All Cities</option></select>
      <select class="ss" id="q-spec" onchange="applyF()">
        <option value="">All Specialities</option>
<option value="Cardiac & Circulatory Disorder">Cardiac & Circulatory Disorder</option>
<option value="Dermatology">Dermatology</option>
<option value="ENT">ENT</option>

<option value="Pediatrics">Pediatrics</option>

<option value="SBI">SBI</option>

      <button class="btn-s" onclick="applyF()">Search</button>

    <div class="frow">

</div>
<div class="kpi-strip" id="kpi-strip"></div>
<div class="wrap"><div class="content">
  <div class="rhead">
    <div>
      <div class="rtitle" id="res-title">All Hospitals</div>
      <div class="rcnt" id="res-cnt">-- results</div>
    </div>
    <button class="btn-dl" onclick="dlCSV()">&#x2193; Download CSV</button>

    <div id="pg-info">Page 1 of 1</div>
    <div class="pgbtns">
      <button class="pgbtn" id="pg-prev" onclick="chgPage(-1)" disabled>&#8592; Prev</button>
      <button class="pgbtn" id="pg-next" onclick="chgPage(1)">Next &#8594;</button>
    </div>

</div></div>

<script>
var DATA=[];
var filtered=DATA.slice();
var page=1;
var PS=24;
var CC={
  'Delhi':'#3b82f6','Faridabad':'#f59e0b','Gurgaon':'#8b5cf6',
  'Noida':'#0d9488','Ghaziabad':'#ef4444','Mumbai':'#f97316',
  'Navi Mumbai':'#be185d','Pune':'#22c55e','Hyderabad':'#e11d48',
  'Bangalore':'#6366f1','Ahmedabad':'#0ea5e9'
};

var KPI_CITIES=[];
function buildKPI(){
  var cnt=new Map(), ppnTotal=0;
  var selectedSource=document.getElementById('q-source').value;
  var kpiRows=selectedSource?DATA.filter(function(r){return r.source===selectedSource;}):DATA;
  kpiRows.forEach(function(r){
    var st=r.state||'', c=r.city||'', k=st+'|'+c;
    var entry=cnt.get(k)||{state:st,city:c,count:0,ppn:0};
    entry.count++;
    if(r.ppn){entry.ppn++;ppnTotal++;}
    cnt.set(k,entry);
  });
  KPI_CITIES=Array.from(cnt.values()).sort(function(a,b){return b.count-a.count;}).slice(0,12);
  var html='<div class="kc active" id="kc-All" onclick="fcity(this)"><div class="kc-name">All India</div><div class="kc-num">'+kpiRows.length.toLocaleString()+'</div><div class="kc-ppn">'+ppnTotal+' PPN</div></div>';
  KPI_CITIES.forEach(function(item,i){
    html+='<div class="kc" id="kc-'+i+'" onclick="fcity(this)"><div class="kc-name">'+esc(item.city)+'</div><div class="kc-num">'+item.count.toLocaleString()+'</div><div class="kc-ppn">'+esc(item.state)+' · '+item.ppn+' PPN</div></div>';
  });
  document.getElementById('kpi-strip').innerHTML=html;
  document.getElementById('total-badge').textContent=DATA.length.toLocaleString()+' Hospitals';
}


function setActive(city){
  document.querySelectorAll('.kc').forEach(function(el){el.classList.remove('active');});
  var state=document.getElementById('q-state').value;
  var index=KPI_CITIES.findIndex(function(x){return x.city===city && x.state===state;});
  var el=document.getElementById(!city && !state?'kc-All':('kc-'+index));
  if(el)el.classList.add('active');
}

function fcity(el){
  var id=el.id;
  if(id==='kc-All'){
    document.getElementById('q-state').value='';
    syncCityOptions();
    document.getElementById('q-city').value='';
  }else{
    var v=KPI_CITIES[Number(id.replace('kc-',''))];
    if(!v)return;
    document.getElementById('q-state').value=v.state;
    syncCityOptions();
    document.getElementById('q-city').value=v.city;
  }
  applyF();
}


function applyF(){
  var q=document.getElementById('q-search').value.toLowerCase().trim();
  var city=document.getElementById('q-city').value;
  var state=document.getElementById('q-state').value;
  var source=document.getElementById('q-source').value;
  var spec=document.getElementById('q-spec').value.toLowerCase();
  var ins=document.getElementById('q-ins').value.toLowerCase();
  var ppnOnly=document.getElementById('q-ppn').checked;
  filtered=DATA.filter(function(r){
    if(source&&r.source!==source)return false;
    if(state&&r.state!==state)return false;
    if(city&&r.city!==city)return false;
    if(ppnOnly){if(ins){if(!(r.ppn_insurers||[]).some(function(n){return n.toLowerCase()===ins;}))return false;}else if(!r.ppn)return false;}
    if(spec&&r.spec.toLowerCase().indexOf(spec)===-1)return false;
    if(ins&&(r.ins||'').split(', ').every(function(n){return n.toLowerCase()!==ins;}))return false;
    if(q){
      var h=(r.name+' '+r.address+' '+(r.area||'')+' '+r.city+' '+r.state+' '+r.pin+' '+r.source+' '+(r.network_type||'')).toLowerCase();
      if(h.indexOf(q)===-1)return false;
    }
    return true;
  });
  page=1;
  setActive(document.getElementById('q-city').value||'All');
  render();
}

function render(){
  var total=filtered.length;
  var pages=Math.max(1,Math.ceil(total/PS));
  var slice=filtered.slice((page-1)*PS,page*PS);
  var city=document.getElementById('q-city').value;
  document.getElementById('res-cnt').textContent=total.toLocaleString()+' hospitals found';
  document.getElementById('res-title').textContent=city?city+' Hospitals':'All Hospitals';
  document.getElementById('pg-info').textContent='Page '+page+' of '+pages+' ('+total.toLocaleString()+' results)';
  document.getElementById('pg-prev').disabled=(page<=1);
  document.getElementById('pg-next').disabled=(page>=pages);
  if(!slice.length){
    document.getElementById('hgrid').innerHTML='<div class="nores"><div style="font-size:48px;margin-bottom:12px">&#127973;</div><div style="font-size:16px;font-weight:700;color:#374151;margin-bottom:6px">No hospitals found</div><div>Try different search terms or reset filters</div></div>';
    return;
  }
  var html='';
  slice.forEach(function(r){
    var col=CC[r.city]||'#3b82f6';
    var specs='';
    if(r.spec){
      var sarr=r.spec.split(', ').filter(function(s){return s&&s.length>2;}).slice(0,4);
      sarr.forEach(function(s){specs+='<span class="sp">'+esc(s)+'</span>';});
    }
    var insArr=r.ins?r.ins.split(', ').map(function(i){return i.trim();}).filter(Boolean):[];
    var selectedIns=document.getElementById('q-ins').value;
    var selectedLower=selectedIns.toLowerCase();
    // Show the insurer the user searched for FIRST. Show actual insurer names,
    // not an unverified "35+" empanelment claim.
    var matching=insArr.filter(function(i){return selectedIns&&i.toLowerCase()===selectedLower;});
    var others=insArr.filter(function(i){return !selectedIns||i.toLowerCase()!==selectedLower;});
    var ordered=matching.concat(others);
    function insurerChip(i){
      return '<span class="ins-chip'+(selectedIns&&i.toLowerCase()===selectedLower?' ins-match':'')+'">'+esc(i)+'</span>';
    }
    var insTxt='';
    if(ordered.length){
      insTxt='<div class="ins-chips">'+ordered.slice(0,8).map(insurerChip).join('')+'</div>';
      if(ordered.length>8){
        insTxt+='<details class="ins-more"><summary>Show all '+ordered.length+' insurers</summary>'+
          '<div class="ins-chips">'+ordered.slice(8).map(insurerChip).join('')+'</div></details>';
      }
    }else{
      insTxt='<span class="ins-empty">No insurer list provided by the source</span>';
    }
    var ph=(r.phone&&r.phone!=='nan'&&r.phone.length>3)?r.phone:'';
    var cardHtml='<div class="hcard'+(r.ppn?' ppn':'')+'">'+
      '<div class="ctop">'+
        '<div class="cname">'+esc(r.name)+'</div>'+
        '<div class="cbadges">'+
       '<span class="badge" style="background:#e0e7ff;color:#3730a3">'+esc(r.source||'Unknown source')+'</span>'+
       (r.source==='IndusInd General Insurance'&&r.network_type?'<span class="badge" style="background:#e0f2fe;color:#075985">'+esc(r.network_type)+'</span>':'')+
          (r.ppn?'<span class="badge ppn">&#10003; PPN</span>':'')+
          '<span class="badge city" style="background:'+col+'18;color:'+col+'">'+esc(r.city)+', '+esc(r.state)+'</span>'+
        '</div>'+
      '</div>'+
      '<div class="caddr">&#128205; '+esc(r.address)+'</div>'+
      (ph?'<div class="cdet"><span class="cico">&#128222;</span>'+esc(ph)+'</div>':'')+
      (r.pin&&r.pin!=='nan'&&r.pin.length>2?'<div class="cdet"><span class="cico">&#128206;</span>PIN '+esc(r.pin)+'</div>':'')+
      (r.rating>0?'<div class="cdet"><span class="cico">&#11088;</span>'+r.rating.toFixed(1)+' / 5.0</div>':'')+
      (specs?'<div class="spwrap">'+specs+'</div>':'')+
      (insTxt?'<div class="inssec"><div class="inslbl">'+(r.source==='ICICI Lombard'?'ICICI Lombard search directory — verify policy eligibility':(r.source==='IndusInd General Insurance'?'IndusInd General Insurance source listing — verify policy eligibility':'Insurers listed by Medi Assist'))+' ('+insArr.length+')</div>'+insTxt+'</div>':'')+
    '</div>';
    html+=cardHtml;
  });
  document.getElementById('hgrid').innerHTML=html;
}

function chgPage(d){
  var pages=Math.ceil(filtered.length/PS);
  page=Math.max(1,Math.min(pages,page+d));
  render();
  window.scrollTo({top:300,behavior:'smooth'});
}

function clearF(){
  ['q-search','q-source','q-state','q-city','q-spec','q-ins'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('q-ppn').checked=false;
  applyF();
}

function dlCSV(){
  var hdr=['Source','Source ID','Name','Address','State','City','PIN','Phone','PPN','Rating','Ins_Count','Specialities','Insurers'];
  var rows=filtered.map(function(r){
    return [
      '"'+(r.source||'').replace(/"/g,"''")+'"',
      '"'+String(r.reference_id||r.id||'').replace(/"/g,"''")+'"',
      '"'+r.name.replace(/"/g,"''")+'"',
      '"'+r.address.replace(/"/g,"''")+'"',
      r.state,r.city,r.pin,r.phone,
      r.ppn?'Yes':'No',
      r.rating,r.ins_count,
      '"'+r.spec+'"',
      '"'+r.ins+'"'
    ].join(',');
  });
  var csv=[hdr.join(',')].concat(rows).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='MediAssist_Hospitals_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

function esc(v){
  var s=String(v == null ? '' : v);
  for(var k=0;k<3;k++){
    var next=s.replace(/&amp;/gi,'&').replace(/&#0*38;/g,'&');
    if(next===s)break;
    s=next;
  }
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function syncFilterOptions(){
  var insurers=new Set(), specialties=new Set();
  DATA.forEach(function(r){
    (r.ins||'').split(', ').forEach(function(x){if(x.trim())insurers.add(x.trim());});
    (r.spec||'').split(', ').forEach(function(x){if(x.trim())specialties.add(x.trim());});
  });
  [['q-ins','All Insurers',insurers],['q-spec','All Specialities',specialties]].forEach(function(p){
    var el=document.getElementById(p[0]);
    el.replaceChildren(new Option(p[1],''));
    Array.from(p[2]).sort(function(a,b){return a.localeCompare(b);}).forEach(function(x){el.add(new Option(x,x));});
  });
}
function syncLocationOptions(){
  var stateSelect=document.getElementById('q-state');
  var states=new Set(DATA.map(function(r){return r.state||'';}).filter(Boolean));
  stateSelect.replaceChildren(new Option('All States',''));
  Array.from(states).sort(function(a,b){return a.localeCompare(b);}).forEach(function(s){
    stateSelect.add(new Option(s,s));
  });
  syncCityOptions();
}
function syncCityOptions(){
  var selectedState=document.getElementById('q-state').value;
  var citySelect=document.getElementById('q-city');
  var cities=new Set(DATA.filter(function(r){return !selectedState||r.state===selectedState;}).map(function(r){return r.city||'';}).filter(Boolean));
  citySelect.replaceChildren(new Option('All Cities',''));
  Array.from(cities).sort(function(a,b){return a.localeCompare(b);}).forEach(function(c){
    citySelect.add(new Option(c,c));
  });
}
function onStateChange(){
  syncCityOptions();
  applyF();
}

<!-- NETWORKIQ_THREE_SOURCE_INDUSIND_V1 -->
// NETWORKIQ_DUAL_SOURCE_ICICI_V1
function networkiqCity(v){
  var s=String(v||'').trim().replace(/\s+/g,' ');
  var key=s.toLocaleLowerCase('en-IN');
  var aliases={'gurugram':'Gurgaon','gurgaon':'Gurgaon',
               'bengaluru':'Bangalore','bangalore':'Bangalore',
               'belagavi':'Belgaum','belgaum':'Belgaum'};
  return aliases[key]||s.toLocaleLowerCase('en-IN').replace(/\b\S/g,function(c){return c.toLocaleUpperCase('en-IN');});
}
function networkiqState(v){
  var s=String(v||'').trim().replace(/\s+/g,' ');
  return s.toLocaleLowerCase('en-IN').replace(/\b\S/g,function(c){return c.toLocaleUpperCase('en-IN');});
}
function networkiqRows(rows,source){
  return rows.map(function(r){
    var x=Object.assign({},r);
    x.source=source;
    x.source_city=r.city;
    x.source_state=r.state;
    x.city=networkiqCity(r.city);
    x.state=networkiqState(r.state);
    x.pin=x.pin||'';
    x.phone=x.phone||'';
    x.spec=x.spec||'';
    x.rating=Number(x.rating)||0;
    x.ppn=source==='Medi Assist'&&r.ppn===true;
    x.ppn_insurers=source==='Medi Assist'&&Array.isArray(r.ppn_insurers)?r.ppn_insurers:[];
    x.ins=x.ins||'';
    x.ins_count=Number(x.ins_count)||0;
    return x;
  });
}
function networkiqDate(v){
  if(!v)return 'date unknown';
  var dt=new Date(v);
  return isNaN(dt.getTime())?'date unknown':dt.toLocaleDateString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',year:'numeric'});
}
function loadCurrentNetwork(){
  Promise.all([
    fetch('./data/hospitals.json',{cache:'no-store'}).then(function(res){
      if(!res.ok)throw new Error('Medi Assist file HTTP '+res.status);return res.json();
    }),
    fetch('./data/icici_lombard.json',{cache:'no-store'}).then(function(res){
      if(!res.ok)throw new Error('ICICI file HTTP '+res.status);return res.json();
    }),
    fetch('./data/indusind_general.json',{cache:'no-store'}).then(function(res){
      if(!res.ok)throw new Error('IndusInd file HTTP '+res.status);return res.json();
    })
  ]).then(function(parts){
    var medi=parts[0], icici=parts[1], indus=parts[2];
    if(!Array.isArray(medi.hospitals)||medi.hospitals.length<20000||!medi.metadata||medi.metadata.scope!=='nationwide')
      throw new Error('Missing or incomplete Medi Assist nationwide dataset');
    if(!Array.isArray(icici.hospitals)||icici.hospitals.length<14000||!icici.metadata||icici.metadata.verification_level!=='OFFICIAL_SEARCH_RESULT_ONLY'||icici.hospitals.length!==icici.metadata.record_count)
      throw new Error('Missing or incomplete ICICI Lombard snapshot');
    if(!indus.metadata || indus.metadata.source_name!=='IndusInd General Insurance' || indus.metadata.verification_level!=='OFFICIAL_SEARCH_RESULT_ONLY' || !Array.isArray(indus.hospitals) || indus.hospitals.length!==indus.metadata.record_count || indus.hospitals.length!==15229)
      throw new Error('Missing or incomplete IndusInd nationwide snapshot');
    DATA=networkiqRows(medi.hospitals,'Medi Assist').concat(networkiqRows(icici.hospitals,'ICICI Lombard'),networkiqRows(indus.hospitals,'IndusInd General Insurance'));
    filtered=DATA.slice();
    syncFilterOptions();
    syncLocationOptions();
    var hero=document.getElementById('source-meta');
    if(hero)hero.textContent='Nationwide search · '+medi.hospitals.length.toLocaleString('en-IN')+' Medi Assist records (API '+networkiqDate(medi.metadata.snapshot_retrieved_at_utc)+') + '+icici.hospitals.length.toLocaleString('en-IN')+' ICICI Lombard search listings (captured through '+networkiqDate(icici.metadata.observed_through_utc)+') + '+indus.hospitals.length.toLocaleString('en-IN')+' IndusInd source listings (API '+networkiqDate(indus.metadata.retrieved_at_utc)+', IPD/OPD distinguished). These are source records, not unique hospitals. Verify current policy-specific cashless eligibility with insurer/TPA.';
    buildKPI();applyF();
  }).catch(function(err){
    console.error('Network data could not be loaded',err);
    document.getElementById('total-badge').textContent='Data unavailable';
    document.getElementById('res-cnt').textContent='Unable to load complete network dataset';
    document.getElementById('hgrid').textContent='Network data is unavailable or incomplete. Please try again later. No partial data will be shown as complete.';
  });
}

loadCurrentNetwork();
